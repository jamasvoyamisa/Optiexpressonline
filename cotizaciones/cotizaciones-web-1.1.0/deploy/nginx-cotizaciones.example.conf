# Ejemplo para nginx en el VPS (Ubuntu/Debian).
# Copia a /etc/nginx/sites-available/cotizaciones y enlaza:
#   sudo ln -sf /etc/nginx/sites-available/cotizaciones /etc/nginx/sites-enabled/
# Ajusta server_name y rutas de certificados; luego: sudo nginx -t && sudo systemctl reload nginx
#
# La app Node debe escuchar en 127.0.0.1:3080 (HOST=127.0.0.1 y PORT=3080 en .env).

upstream cotizaciones_node {
    server 127.0.0.1:3080;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name cotizaciones.tudominio.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cotizaciones.tudominio.com;

    ssl_certificate     /etc/letsencrypt/live/cotizaciones.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cotizaciones.tudominio.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://cotizaciones_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
