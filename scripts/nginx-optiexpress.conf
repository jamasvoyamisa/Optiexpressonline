# Configuración Nginx para Optiexpress (Landing + React App + API)
# Servidor: 148.230.83.108 (Hostinger VPS)
#
# Copiar: sudo cp scripts/nginx-optiexpress.conf /etc/nginx/sites-available/optiexpress
# Habilitar: sudo ln -sf /etc/nginx/sites-available/optiexpress /etc/nginx/sites-enabled/
# Deshabilitar default: sudo rm -f /etc/nginx/sites-enabled/default
# Probar: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name 148.230.83.108 _;
    root /opt/optiexpress/web;

    # API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:9081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:9081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Portal de checadas remotas (HTML servido por backend)
    location /portal {
        proxy_pass http://127.0.0.1:9081/portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Landing: página inicial y páginas estáticas
    location = / {
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|avisos\.html|catalogos\.html|promociones-activas\.html|script\.js|styles\.css|aurora\.js|robots\.txt|\.htaccess)$ {
        try_files $uri =404;
    }

    # Imágenes y assets de la landing
    location /images/ {
        try_files $uri =404;
    }

    # React App: SPA (login, dashboard, rh, etc.)
    location ~ ^/(login|dashboard|rh|asistencia|mi-area|configuracion|mis-asistencias|mis-vacaciones|mis-prestamos|mis-datos|solicitudes-vacaciones) {
        try_files /app.html =404;
    }

    # Assets del React build (JS, CSS con hash)
    location /assets/ {
        alias /opt/optiexpress/frontend/dist/assets/;
    }

    # Favicon y otros estáticos del React
    location ~ ^/(favicon\.ico|GPO-Cristal-bco\.png)$ {
        try_files $uri /opt/optiexpress/frontend/dist$uri =404;
    }

    # Cualquier otra ruta no encontrada → React SPA (para rutas protegidas)
    location / {
        try_files $uri $uri/ /app.html =404;
    }
}
