# Configuración Nginx para Optiexpress
# Copiar a: sudo cp nginx-optiexpress.conf /etc/nginx/sites-available/optiexpress
# Habilitar: sudo ln -sf /etc/nginx/sites-available/optiexpress /etc/nginx/sites-enabled/
# Deshabilitar default si existe: sudo rm /etc/nginx/sites-enabled/default
# Probar: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;
    root /opt/optiexpress/frontend/dist;
    index index.html;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Backend
    location /api/ {
        proxy_pass http://127.0.0.1:9081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:9081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
