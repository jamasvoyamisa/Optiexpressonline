# Configuración Nginx para Optiexpress (Landing + React App + API)
# Servidor: 148.230.83.108 (Hostinger VPS)
#
# Copiar: sudo cp scripts/nginx-optiexpress.conf /etc/nginx/sites-available/optiexpress
# Habilitar: sudo ln -sf /etc/nginx/sites-available/optiexpress /etc/nginx/sites-enabled/
# Deshabilitar default: sudo rm -f /etc/nginx/sites-enabled/default
# Probar: sudo nginx -t && sudo systemctl reload nginx
#
# Acceso solo por dominio (HTTPS). Acceso por IP u host desconocido: conexión cerrada (444).

# ---------- HTTP: dominio → HTTPS + ACME ----------
server {
    listen 80;
    server_name intranetoptiexpress.net www.intranetoptiexpress.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: aplicación ----------
server {
    listen 443 ssl http2;
    server_name intranetoptiexpress.net www.intranetoptiexpress.net;
    root /opt/optiexpress/web;

    ssl_certificate /etc/letsencrypt/live/intranetoptiexpress.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intranetoptiexpress.net/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:9081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffer_size 128k;
        proxy_buffers 8 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        proxy_pass http://127.0.0.1:9081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /portal {
        proxy_pass http://127.0.0.1:9081/portal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Formulario público de tickets (no /soporte: esa ruta la usa el build React "Soporte TI")
    location /ticket-soporte {
        proxy_pass http://127.0.0.1:9081/ticket-soporte;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cotizaciones (Node Express en 127.0.0.1:3080; ver systemd optiexpress-cotizaciones)
    location = /cotizaciones {
        return 301 /cotizaciones/;
    }

    location /cotizaciones/ {
        proxy_pass http://127.0.0.1:3080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 32m;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    location ~ ^/(index\.html|catalogos\.html|promociones-activas\.html|script\.js|styles\.css|aurora\.js|header-nav\.js|catalogos\.js|robots\.txt|\.htaccess)$ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    location /assets/ {
        alias /opt/optiexpress/frontend/dist/assets/;
        # Activos con hash en el nombre: se pueden cachear permanentemente
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Estáticos del build de Vite (root global es web; estos viven en frontend/dist)
    location = /favicon.ico {
        alias /opt/optiexpress/frontend/dist/favicon.png;
        default_type image/png;
        access_log off;
    }

    location ~ ^/(favicon\.png|GPO-Cristal-bco\.png)$ {
        root /opt/optiexpress/frontend/dist;
        try_files $uri =404;
        access_log off;
    }

    # SPA React: sirve index.html desde el dist — siempre fresco para que el
    # navegador cargue el JS correcto después de cada deploy.
    #
    # Content-Security-Policy-Report-Only: modo de solo-reporte (no bloquea nada,
    # solo registra violaciones en la consola del navegador). Sirve para EVALUAR
    # el impacto antes de aplicar una CSP real. Tras verificar en el servidor de
    # pruebas (y unos días en producción) que no aparecen violaciones inesperadas,
    # cambiar el nombre del header a "Content-Security-Policy" para que bloquee.
    location @react_spa {
        root /opt/optiexpress/frontend/dist;
        try_files /index.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    }

    location / {
        try_files $uri $uri/ @react_spa;
    }
}

# ---------- Bloquear IP y cualquier Host que no sea el dominio (HTTP) ----------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ---------- Bloquear IP y Host desconocido en HTTPS (mismo cert para el handshake) ----------
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/intranetoptiexpress.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intranetoptiexpress.net/privkey.pem;

    return 444;
}
