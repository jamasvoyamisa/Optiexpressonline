<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checadas Remotas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d2137 100%);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .subtitle {
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.9);
    }
    select, input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    select option { background: #1e3a5f; color: #fff; }
    input::placeholder { color: rgba(255,255,255,0.4); }
    button {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 8px;
      background: #0ea5e9;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover:not(:disabled) { background: #0284c7; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg {
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      text-align: center;
    }
    .msg.ok { background: rgba(34, 197, 94, 0.3); color: #86efac; }
    .msg.err { background: rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .msg.hide { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Checada Remota</h1>
    <p class="subtitle">Ingresa tu empresa, número de empleado y contraseña</p>
    <form id="form">
      <label for="empresa">Empresa</label>
      <select id="empresa" required>
        <option value="">-- Selecciona tu empresa --</option>
      </select>
      <label for="numero">Número de empleado</label>
      <input type="text" id="numero" placeholder="Ej: 001" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña de la app" required autocomplete="current-password">
      <button type="submit" id="btn">Registrar checada</button>
    </form>
    <div id="msg" class="msg hide"></div>
  </div>
  <script>
    const form = document.getElementById('form');
    const empresaSelect = document.getElementById('empresa');
    const numeroInput = document.getElementById('numero');
    const passwordInput = document.getElementById('password');
    const btn = document.getElementById('btn');
    const msgEl = document.getElementById('msg');

    const API = '/api/v1/portal';

    async function loadEmpresas() {
      try {
        const r = await fetch(API + '/empresas');
        const data = await r.json();
        empresaSelect.innerHTML = '<option value="">-- Selecciona tu empresa --</option>';
        data.forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = e.nombre;
          empresaSelect.appendChild(opt);
        });
      } catch (err) {
        showMsg('No se pudieron cargar las empresas. Verifica la conexión.', false);
      }
    }

    function showMsg(text, ok) {
      msgEl.textContent = text;
      msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
      msgEl.classList.remove('hide');
    }

    function hideMsg() {
      msgEl.classList.add('hide');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMsg();
      btn.disabled = true;
      try {
        const r = await fetch(API + '/checadas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            empresa_id: parseInt(empresaSelect.value),
            numero_empleado: numeroInput.value.trim(),
            password: passwordInput.value,
          }),
        });
        const data = await r.json();
        if (data.ok) {
          showMsg(data.timestamp ? `${data.mensaje} (${data.timestamp})` : data.mensaje, true);
          passwordInput.value = '';
        } else {
          showMsg(data.mensaje || 'Error al registrar', false);
        }
      } catch (err) {
        showMsg('Error de conexión. Intenta de nuevo.', false);
      } finally {
        btn.disabled = false;
      }
    });

    loadEmpresas();
  </script>
</body>
</html>
