<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checadas Remotas</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #0d2137 100%);
      color: #fff;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 600; }
    .subtitle { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 1.5rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: rgba(255,255,255,0.9); }
    select, input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 1rem; margin-bottom: 1rem;
    }
    select option { background: #1e3a5f; color: #fff; }
    input::placeholder { color: rgba(255,255,255,0.4); }
    button.btn-submit {
      width: 100%; padding: 1rem; border: none; border-radius: 8px;
      background: #0ea5e9; color: #fff; font-size: 1.1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
    }
    button.btn-submit:hover:not(:disabled) { background: #0284c7; }
    button.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .msg-err {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem; text-align: center;
      background: rgba(239,68,68,0.3); color: #fca5a5;
    }
    .msg-ok {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem; text-align: center;
      background: rgba(22,163,74,0.25); color: #bbf7d0;
      border: 1px solid rgba(34,197,94,0.4);
    }
    .msg-info {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem; text-align: center;
      background: rgba(59,130,246,0.2); color: #bfdbfe;
    }
    .hide { display: none !important; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    .modal-box {
      background: #fff; border-radius: 20px;
      padding: 2.5rem 2rem; max-width: 340px; width: 90%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      text-align: center; color: #111;
    }
    .modal-icon {
      width: 72px; height: 72px; border-radius: 50%;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .modal-badge {
      display: inline-block; padding: 4px 16px; border-radius: 20px;
      font-size: 0.88rem; font-weight: 700; margin-bottom: 14px;
    }
    .modal-nombre {
      font-size: 1.15rem; font-weight: 700; color: #1e3a5f; margin: 0 0 4px;
    }
    .modal-hora {
      font-size: 2rem; font-weight: 800; color: #0f172a;
      letter-spacing: 0.02em; margin: 0 0 2px;
    }
    .modal-fecha {
      font-size: 0.85rem; color: #6b7280; margin: 0 0 16px;
    }
    .modal-ok {
      color: #16a34a; font-size: 0.9rem; font-weight: 600;
      margin: 0 0 18px; border-top: 1px solid #f0f0f0; padding-top: 14px;
    }
    .btn-aceptar {
      padding: 10px 36px; background: #0ea5e9; color: #fff;
      border: none; border-radius: 10px; font-size: 0.95rem;
      font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(14,165,233,0.4);
    }
    .btn-aceptar:hover { background: #0284c7; }
  </style>
</head>
<body>
  <!-- Día completado o no laboral: sin formulario de checada -->
  <div id="panel-completado" class="card hide">
    <h1 id="titulo-completado">¡Listo por hoy!</h1>
    <p id="texto-completado" class="subtitle" style="margin-bottom:0;"></p>
    <p id="sub-completado" style="color: rgba(255,255,255,0.75); font-size: 0.88rem; margin-top: 1rem;"></p>
  </div>

  <div class="card" id="card-form">
    <h1>Checada Remota</h1>
    <p class="subtitle">Ingresa tu empresa, número de empleado y contraseña. Se requieren 4 checadas de lunes a viernes y 2 los sábados (si trabajas sábado).</p>
    <form id="form">
      <label for="empresa">Empresa</label>
      <select id="empresa" required>
        <option value="">-- Selecciona tu empresa --</option>
      </select>
      <label for="numero">Número de empleado</label>
      <input type="text" id="numero" placeholder="Ej: 001" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" placeholder="Tu contraseña de la app" required autocomplete="current-password">
      <button type="button" class="btn-submit" id="btn-estado" style="margin-bottom:0.75rem;background:#334155;font-size:1rem;">Consultar estado de hoy</button>
      <button type="submit" class="btn-submit" id="btn">Registrar checada</button>
    </form>
    <div id="msg-err" class="msg-err hide"></div>
    <div id="msg-info" class="msg-info hide"></div>
    <div id="msg-ok-inline" class="msg-ok hide"></div>
  </div>

  <!-- Modal de confirmación -->
  <div id="modal" class="modal-overlay hide">
    <div class="modal-box">
      <div id="modal-icon" class="modal-icon"></div>
      <div id="modal-badge" class="modal-badge"></div>
      <p id="modal-nombre" class="modal-nombre"></p>
      <p id="modal-hora" class="modal-hora"></p>
      <p id="modal-fecha" class="modal-fecha"></p>
      <p class="modal-ok">✓ Checada registrada correctamente</p>
      <button class="btn-aceptar" onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script>
    const API = '/api/v1/portal';

    const TIPOS = {
      entrada:       { label: 'Entrada',          color: '#065f46', bg: '#d1fae5', icon: '🟢' },
      salida_comer:  { label: 'Salida a comer',   color: '#92400e', bg: '#fef3c7', icon: '🍽️' },
      regreso_comer: { label: 'Regreso de comer', color: '#1e40af', bg: '#dbeafe', icon: '↩️' },
      salida:        { label: 'Salida',           color: '#991b1b', bg: '#fee2e2', icon: '🔴' },
    };

    async function loadEmpresas() {
      try {
        const r = await fetch(API + '/empresas');
        const data = await r.json();
        const sel = document.getElementById('empresa');
        sel.innerHTML = '<option value="">-- Selecciona tu empresa --</option>';
        data.forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = e.nombre;
          sel.appendChild(opt);
        });
        if (data.length === 1) sel.value = data[0].id;
      } catch {
        mostrarError('No se pudieron cargar las empresas. Verifica la conexión.');
      }
    }

    function mostrarError(texto) {
      const el = document.getElementById('msg-err');
      el.textContent = texto;
      el.classList.remove('hide');
    }

    function ocultarError() {
      document.getElementById('msg-err').classList.add('hide');
    }

    function ocultarInfo() {
      document.getElementById('msg-info').classList.add('hide');
      document.getElementById('msg-ok-inline').classList.add('hide');
    }

    function mostrarInfo(texto) {
      ocultarError();
      const el = document.getElementById('msg-info');
      el.textContent = texto;
      el.classList.remove('hide');
    }

    function mostrarOkInline(texto) {
      ocultarError();
      const el = document.getElementById('msg-ok-inline');
      el.textContent = texto;
      el.classList.remove('hide');
    }

    function mostrarPanelCompletado(titulo, texto, sub) {
      document.getElementById('card-form').classList.add('hide');
      document.getElementById('panel-completado').classList.remove('hide');
      document.getElementById('titulo-completado').textContent = titulo;
      document.getElementById('texto-completado').textContent = texto;
      document.getElementById('sub-completado').textContent = sub || '';
    }

    function aplicarEstadoDesdeServidor(data) {
      ocultarInfo();
      if (data.dia_no_laboral) {
        mostrarPanelCompletado('No aplica checada', data.mensaje || '', '');
        return;
      }
      if (data.completado && data.requeridas_hoy > 0) {
        mostrarPanelCompletado(
          '¡Listo por hoy!',
          'Ya registraste las ' + data.requeridas_hoy + ' checadas necesarias de este día.',
          data.nombre_empleado ? ('Hola, ' + data.nombre_empleado + '.') : ''
        );
        return;
      }
      if (data.requeridas_hoy > 0 && !data.completado) {
        mostrarOkInline('Progreso hoy: ' + data.checadas_hoy + ' de ' + data.requeridas_hoy + ' checadas.');
      }
    }

    async function consultarEstado() {
      ocultarError();
      ocultarInfo();
      const empresa = document.getElementById('empresa').value;
      const numero = document.getElementById('numero').value.trim();
      const password = document.getElementById('password').value;
      if (!empresa || !numero || !password) {
        mostrarError('Selecciona empresa, número y contraseña para consultar.');
        return;
      }
      const btn = document.getElementById('btn-estado');
      btn.disabled = true;
      try {
        const r = await fetch(API + '/estado-hoy', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            empresa_id: parseInt(empresa, 10),
            numero_empleado: numero,
            password: password,
          }),
        });
        const data = await r.json();
        if (!data.ok) {
          mostrarError(data.mensaje || 'No se pudo consultar.');
          return;
        }
        aplicarEstadoDesdeServidor(data);
      } catch {
        mostrarError('Error de conexión.');
      } finally {
        btn.disabled = false;
      }
    }

    function abrirModal(data) {
      const tipo = TIPOS[data.tipo] || { label: data.tipo || 'Checada', color: '#374151', bg: '#f3f4f6', icon: '✅' };

      document.getElementById('modal-icon').style.background = tipo.bg;
      document.getElementById('modal-icon').textContent = tipo.icon;

      const badge = document.getElementById('modal-badge');
      badge.textContent = tipo.label;
      badge.style.background = tipo.bg;
      badge.style.color = tipo.color;

      document.getElementById('modal-nombre').textContent = data.nombre_empleado || '';

      if (data.timestamp) {
        const hora = data.timestamp.slice(11, 16);
        const fecha = data.timestamp.slice(0, 10);
        document.getElementById('modal-hora').textContent = hora;
        document.getElementById('modal-fecha').textContent = fecha;
      } else {
        document.getElementById('modal-hora').textContent = '';
        document.getElementById('modal-fecha').textContent = '';
      }

      document.getElementById('modal').classList.remove('hide');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.add('hide');
    }

    document.getElementById('btn-estado').addEventListener('click', () => consultarEstado());

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarError();
      ocultarInfo();
      const btn = document.getElementById('btn');
      btn.disabled = true;
      try {
        const r = await fetch(API + '/checadas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            empresa_id: parseInt(document.getElementById('empresa').value),
            numero_empleado: document.getElementById('numero').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const data = await r.json();
        if (data.completado && !data.ok) {
          if (data.dia_no_laboral) {
            mostrarPanelCompletado('No aplica checada', data.mensaje || '', '');
          } else {
            mostrarPanelCompletado(
              '¡Listo por hoy!',
              data.mensaje || 'Ya completaste las checadas necesarias.',
              ''
            );
          }
          return;
        }
        if (data.ok && data.completado) {
          document.getElementById('password').value = '';
          mostrarPanelCompletado(
            '¡Listo por hoy!',
            data.mensaje || ('Ya registraste las ' + (data.requeridas_hoy || '') + ' checadas de hoy.'),
            data.nombre_empleado ? ('Hola, ' + data.nombre_empleado + '.') : ''
          );
          return;
        }
        if (data.ok) {
          document.getElementById('password').value = '';
          abrirModal(data);
          if (data.requeridas_hoy && data.checadas_hoy != null) {
            mostrarOkInline('Checadas de hoy: ' + data.checadas_hoy + ' de ' + data.requeridas_hoy + '.');
          }
        } else {
          mostrarError(data.mensaje || 'Error al registrar la checada.');
        }
      } catch {
        mostrarError('Error de conexión. Intenta de nuevo.');
      } finally {
        btn.disabled = false;
      }
    });

    loadEmpresas();
  </script>
</body>
</html>
