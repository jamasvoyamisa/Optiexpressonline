<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
  <meta name="theme-color" content="#0d2137">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Asistencia Remota</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      width: 100%;
    }
    html { background: #0d2137; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      margin: 0;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d2137;
      color: #fff;
      overflow-x: hidden;
      position: relative;
      z-index: 1;
      -webkit-tap-highlight-color: transparent;
    }
    #portal-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: linear-gradient(
        135deg,
        rgba(30,58,95,0.45) 0%,
        rgba(13,33,55,0.45) 100%
      );
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }
    .app-header {
      display: none;
    }
    .app-shell {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .card {
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 2rem;
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 0.9rem;
    }
    .card-logo img,
    .app-header img {
      max-width: 190px;
      height: auto;
      object-fit: contain;
      display: block;
      /* Sin filter: el PNG debe ser legible sobre fondo oscuro (p. ej. GPO-Cristal-bco) */
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 600; }
    .subtitle { color: rgba(255,255,255,0.7); font-size: 0.9rem; margin-bottom: 1.5rem; }
    #card-form > h1,
    #card-form > .subtitle {
      text-align: center;
    }
    #panel-completado h1,
    #panel-completado .subtitle,
    #panel-completado #sub-completado {
      text-align: center;
    }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: rgba(255,255,255,0.9); }
    select, input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #fff;
      font-size: 1rem; margin-bottom: 1rem;
    }
    select option { background: #1e3a5f; color: #fff; }
    input::placeholder { color: rgba(255,255,255,0.4); }
    button.btn-submit {
      width: 100%; padding: 1rem; border: none; border-radius: 14px;
      background: #0ea5e9; color: #fff; font-size: 1.1rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, transform 0.12s;
      min-height: 52px;
    }
    button.btn-submit:active:not(:disabled) { transform: scale(0.98); }
    button.btn-submit:hover:not(:disabled) { background: #0284c7; }
    button.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    #form-checada {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .form-fields {
      flex: 1;
      min-height: 0;
    }
    .form-actions {
      margin-top: 0.5rem;
    }
    .msg-err {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem; text-align: center;
      background: rgba(239,68,68,0.3); color: #fca5a5;
    }
    .msg-ok {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem; text-align: center;
      background: rgba(22,163,74,0.25); color: #bbf7d0;
      border: 1px solid rgba(34,197,94,0.4);
    }
    .msg-info {
      margin-top: 1rem; padding: 0.75rem 1rem; border-radius: 8px;
      font-size: 0.95rem; text-align: center;
      background: rgba(59,130,246,0.2); color: #bfdbfe;
    }
    .hide { display: none !important; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; align-items: center; justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(4px);
    }
    .modal-box {
      background: #fff; border-radius: 20px;
      padding: 2.5rem 2rem; max-width: 340px; width: 90%;
      box-shadow: 0 24px 60px rgba(0,0,0,0.35);
      text-align: center; color: #111;
    }
    .modal-icon {
      width: 72px; height: 72px; border-radius: 50%;
      margin: 0 auto 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
    .modal-badge {
      display: inline-block; padding: 4px 16px; border-radius: 20px;
      font-size: 0.88rem; font-weight: 700; margin-bottom: 14px;
    }
    .modal-nombre {
      font-size: 1.15rem; font-weight: 700; color: #1e3a5f; margin: 0 0 4px;
    }
    .modal-hora {
      font-size: 2rem; font-weight: 800; color: #0f172a;
      letter-spacing: 0.02em; margin: 0 0 2px;
    }
    .modal-fecha {
      font-size: 0.85rem; color: #6b7280; margin: 0 0 16px;
    }
    .modal-ok {
      color: #16a34a; font-size: 0.9rem; font-weight: 600;
      margin: 0 0 18px; border-top: 1px solid #f0f0f0; padding-top: 14px;
    }
    .btn-aceptar {
      padding: 10px 36px; background: #0ea5e9; color: #fff;
      border: none; border-radius: 10px; font-size: 0.95rem;
      font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(14,165,233,0.4);
    }
    .btn-aceptar:hover { background: #0284c7; }

    /* ── Mobile app-like ── */
    @media (max-width: 640px) {
      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        padding: 0;
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        justify-content: flex-start;
        align-items: stretch;
      }
      .app-shell {
        max-width: none;
        flex: 1;
        min-height: 100dvh;
        min-height: -webkit-fill-available;
        display: flex;
        flex-direction: column;
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-bottom: 1px solid rgba(255,255,255,.12);
      }
      .app-header img {
        max-width: 160px;
        height: auto;
        display: block;
      }
      /* Logo solo en barra superior en móvil */
      #card-form .card-logo,
      #panel-completado .card-logo {
        display: none;
      }
      .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        max-width: none;
        width: 100%;
        margin: 0;
        padding: 1.35rem 1.25rem 0;
        border-radius: 22px 22px 0 0;
        min-height: 0;
        box-shadow: 0 -8px 40px rgba(0,0,0,0.25);
      }
      #panel-completado.card {
        padding-bottom: calc(1.5rem + env(safe-area-inset-bottom));
      }
      #card-form h1 {
        font-size: 1.28rem;
        letter-spacing: -0.02em;
      }
      .subtitle {
        font-size: 0.88rem;
        line-height: 1.45;
        margin-bottom: 1.1rem;
      }
      select, input {
        font-size: 16px;
        padding: 0.9rem 1rem;
        border-radius: 12px;
        margin-bottom: 0.95rem;
      }
      label {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        opacity: 0.85;
      }
      #form-checada {
        flex: 1;
        min-height: 0;
      }
      .form-fields {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-bottom: 0.5rem;
      }
      .form-actions {
        margin-top: auto;
        padding-top: 1rem;
        padding-bottom: calc(12px + env(safe-area-inset-bottom));
        position: sticky;
        bottom: 0;
        background: linear-gradient(to top, rgba(13,33,55,0.97) 60%, rgba(13,33,55,0));
        margin-left: -1.25rem;
        margin-right: -1.25rem;
        padding-left: 1.25rem;
        padding-right: 1.25rem;
        margin-bottom: calc(-1px);
      }
      button.btn-submit {
        font-size: 1.08rem;
        padding: 1.05rem 1.25rem;
        min-height: 54px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(14,165,233,0.35);
      }
      .msg-err, .msg-ok, .msg-info {
        margin-top: 0.75rem;
        border-radius: 12px;
      }
    }
  </style>
  <link rel="icon" type="image/png" href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="57x57"   href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="72x72"   href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="76x76"   href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="114x114" href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="120x120" href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="144x144" href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/api/v1/portal/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/api/v1/portal/favicon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Checadas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="Checadas">
</head>
<body>
  <div id="portal-bg"></div>
  <div class="app-shell">
    <div class="app-header">
      <img src="/api/v1/portal/logo" alt="Grupo Cristal" />
    </div>
    <!-- Día completado o no laboral: sin formulario de checada -->
    <div id="panel-completado" class="card hide">
      <h1 id="titulo-completado">¡Listo por hoy!</h1>
      <p id="texto-completado" class="subtitle" style="margin-bottom:0;"></p>
      <p id="sub-completado" style="color: rgba(255,255,255,0.75); font-size: 0.88rem; margin-top: 1rem;"></p>
    </div>

    <div class="card" id="card-form">
      <div class="card-logo">
        <img src="/api/v1/portal/logo" alt="Grupo Cristal" />
      </div>
      <h1>Asistencia Remota</h1>
      <p class="subtitle">Ingresa tu empresa, usuario, contraseña, motivo y permite la ubicación al checar.</p>
      <form id="form-checada">
        <div class="form-fields">
          <label for="empresa">Empresa</label>
          <select id="empresa" required>
            <option value="">-- Selecciona tu empresa --</option>
          </select>
          <label for="username">Usuario</label>
          <input type="text" id="username" placeholder="Tu usuario de la app" required autocomplete="username" autocapitalize="none" spellcheck="false">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Tu contraseña de la app" required autocomplete="current-password">
          <label for="motivo">Motivo de checada remota</label>
          <select id="motivo" required>
            <option value="">-- Selecciona motivo --</option>
            <option value="HO">HO — Home Office</option>
            <option value="TFO">TFO — Trabajo fuera de oficina</option>
            <option value="OTRO">Otro</option>
          </select>
          <div id="wrap-motivo-detalle" class="hide">
            <label for="motivo-detalle">Detalle del motivo</label>
            <input type="text" id="motivo-detalle" placeholder="Describe el motivo" maxlength="255" autocomplete="off">
          </div>
          <p id="geo-hint" class="subtitle" style="margin-top:0;margin-bottom:0.75rem;font-size:0.8rem;">
            Al registrar se pedirá tu ubicación solo en este momento (no se rastrea después).
          </p>
          <div id="msg-err" class="msg-err hide"></div>
          <div id="msg-info" class="msg-info hide"></div>
          <div id="msg-ok-inline" class="msg-ok hide"></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-submit" id="btn">Registrar checada</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de confirmación -->
  <div id="modal" class="modal-overlay hide">
    <div class="modal-box">
      <div id="modal-icon" class="modal-icon"></div>
      <div id="modal-badge" class="modal-badge"></div>
      <p id="modal-nombre" class="modal-nombre"></p>
      <p id="modal-hora" class="modal-hora"></p>
      <p id="modal-fecha" class="modal-fecha"></p>
      <p class="modal-ok">✓ Checada registrada correctamente</p>
      <button class="btn-aceptar" onclick="cerrarModal()">Aceptar</button>
    </div>
  </div>

  <script>
    const API = '/api/v1/portal';

    async function aplicarFondoAleatorio() {
      try {
        const r = await fetch(API + '/backgrounds');
        const data = await r.json();
        const items = Array.isArray(data?.items) ? data.items : [];
        if (!items.length) return;
        const pick = items[Math.floor(Math.random() * items.length)];
        // Aplica el fondo (dechecar / degradado) a un div fijo para evitar franjas en iPhone.
        const bg = document.getElementById('portal-bg');
        if (bg) {
          bg.style.background = `linear-gradient(135deg, rgba(30,58,95,0.45) 0%, rgba(13,33,55,0.45) 100%), url('${pick}')`;
          bg.style.backgroundSize = 'cover';
          bg.style.backgroundPosition = 'center';
          bg.style.backgroundRepeat = 'no-repeat';
        }
      } catch {
        // Si falla, se queda con el fondo degradado por defecto.
      }
    }
    aplicarFondoAleatorio();

    const TIPOS = {
      entrada:       { label: 'Entrada',          color: '#065f46', bg: '#d1fae5', icon: '🟢' },
      salida_comer:  { label: 'Salida a comer',   color: '#92400e', bg: '#fef3c7', icon: '🍽️' },
      regreso_comer: { label: 'Regreso de comer', color: '#1e40af', bg: '#dbeafe', icon: '↩️' },
      salida:        { label: 'Salida',           color: '#991b1b', bg: '#fee2e2', icon: '🔴' },
    };

    async function loadEmpresas() {
      try {
        const r = await fetch(API + '/empresas');
        const data = await r.json();
        const sel = document.getElementById('empresa');
        sel.innerHTML = '<option value="">-- Selecciona tu empresa --</option>';
        data.forEach(e => {
          const opt = document.createElement('option');
          opt.value = e.id;
          opt.textContent = e.nombre;
          sel.appendChild(opt);
        });
        if (data.length === 1) sel.value = data[0].id;
      } catch {
        mostrarError('No se pudieron cargar las empresas. Verifica la conexión.');
      }
    }

    function mostrarError(texto) {
      const el = document.getElementById('msg-err');
      el.textContent = texto;
      el.classList.remove('hide');
    }

    function ocultarError() {
      document.getElementById('msg-err').classList.add('hide');
    }

    function ocultarInfo() {
      document.getElementById('msg-info').classList.add('hide');
      document.getElementById('msg-ok-inline').classList.add('hide');
    }

    function mostrarInfo(texto) {
      ocultarError();
      const el = document.getElementById('msg-info');
      el.textContent = texto;
      el.classList.remove('hide');
    }

    function mostrarOkInline(texto) {
      ocultarError();
      const el = document.getElementById('msg-ok-inline');
      el.textContent = texto;
      el.classList.remove('hide');
    }

    function mostrarPanelCompletado(titulo, texto, sub) {
      document.getElementById('card-form').classList.add('hide');
      document.getElementById('panel-completado').classList.remove('hide');
      document.getElementById('titulo-completado').textContent = titulo;
      document.getElementById('texto-completado').textContent = texto;
      document.getElementById('sub-completado').textContent = sub || '';
    }

    function abrirModal(data) {
      const tipo = TIPOS[data.tipo] || { label: data.tipo || 'Checada', color: '#374151', bg: '#f3f4f6', icon: '✅' };

      document.getElementById('modal-icon').style.background = tipo.bg;
      document.getElementById('modal-icon').textContent = tipo.icon;

      const badge = document.getElementById('modal-badge');
      badge.textContent = tipo.label;
      badge.style.background = tipo.bg;
      badge.style.color = tipo.color;

      document.getElementById('modal-nombre').textContent = data.nombre_empleado || '';

      if (data.timestamp) {
        const hora = data.timestamp.slice(11, 16);
        const fecha = data.timestamp.slice(0, 10);
        document.getElementById('modal-hora').textContent = hora;
        document.getElementById('modal-fecha').textContent = fecha;
      } else {
        document.getElementById('modal-hora').textContent = '';
        document.getElementById('modal-fecha').textContent = '';
      }

      document.getElementById('modal').classList.remove('hide');
    }

    function cerrarModal() {
      document.getElementById('modal').classList.add('hide');
    }

    function obtenerUbicacion() {
      return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
          reject(new Error('Tu navegador no permite geolocalización. Usa otro dispositivo o contacta a RH.'));
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            resolve({
              latitud: pos.coords.latitude,
              longitud: pos.coords.longitude,
              geo_precision_m: typeof pos.coords.accuracy === 'number' ? pos.coords.accuracy : null,
            });
          },
          (err) => {
            let msg = 'No se pudo obtener la ubicación.';
            if (err && err.code === 1) msg = 'Debes permitir la ubicación para registrar la checada remota.';
            else if (err && err.code === 2) msg = 'Ubicación no disponible. Intenta de nuevo o muévete a un lugar con señal.';
            else if (err && err.code === 3) msg = 'Tiempo agotado al obtener ubicación. Intenta de nuevo.';
            reject(new Error(msg));
          },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      });
    }

    document.getElementById('motivo').addEventListener('change', () => {
      const wrap = document.getElementById('wrap-motivo-detalle');
      const det = document.getElementById('motivo-detalle');
      if (document.getElementById('motivo').value === 'OTRO') {
        wrap.classList.remove('hide');
        det.required = true;
      } else {
        wrap.classList.add('hide');
        det.required = false;
        det.value = '';
      }
    });

    document.getElementById('form-checada').addEventListener('submit', async (e) => {
      e.preventDefault();
      ocultarError();
      ocultarInfo();
      const btn = document.getElementById('btn');
      const motivo = document.getElementById('motivo').value;
      if (!motivo) {
        mostrarError('Selecciona el motivo de la checada remota.');
        return;
      }
      if (motivo === 'OTRO' && !document.getElementById('motivo-detalle').value.trim()) {
        mostrarError('Indica el detalle del motivo «Otro».');
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Obteniendo ubicación…';
      try {
        const geo = await obtenerUbicacion();
        btn.textContent = 'Registrando…';
        const r = await fetch(API + '/checadas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            empresa_id: parseInt(document.getElementById('empresa').value),
            username: document.getElementById('username').value.trim().toLowerCase(),
            password: document.getElementById('password').value,
            motivo,
            motivo_detalle: motivo === 'OTRO'
              ? document.getElementById('motivo-detalle').value.trim()
              : null,
            latitud: geo.latitud,
            longitud: geo.longitud,
            geo_precision_m: geo.geo_precision_m,
          }),
        });
        const data = await r.json();
        if (data.completado && !data.ok) {
          if (data.dia_no_laboral) {
            mostrarPanelCompletado('No aplica checada', data.mensaje || '', '');
          } else {
            mostrarPanelCompletado(
              '¡Listo por hoy!',
              data.mensaje || 'Ya completaste las checadas necesarias.',
              ''
            );
          }
          return;
        }
        if (data.ok && data.completado) {
          document.getElementById('password').value = '';
          mostrarPanelCompletado(
            '¡Listo por hoy!',
            data.mensaje || ('Ya registraste las ' + (data.requeridas_hoy || '') + ' checadas de hoy.'),
            data.nombre_empleado ? ('Hola, ' + data.nombre_empleado + '.') : ''
          );
          return;
        }
        if (data.ok) {
          document.getElementById('password').value = '';
          abrirModal(data);
          if (data.requeridas_hoy && data.checadas_hoy != null) {
            mostrarOkInline('Checadas de hoy: ' + data.checadas_hoy + ' de ' + data.requeridas_hoy + '.');
          }
        } else {
          mostrarError(data.mensaje || 'Error al registrar la checada.');
        }
      } catch (err) {
        mostrarError((err && err.message) ? err.message : 'Error de conexión. Intenta de nuevo.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Registrar checada';
      }
    });

    loadEmpresas();
  </script>
</body>
</html>
